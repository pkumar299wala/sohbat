name = "sohbat"
main = "cloudflare/worker.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
VIDEO_PROVIDER = "cloudflare-webrtc"

# Durable Object for per-Darbar real-time room signaling, Pratiksha Kaksh, Shyaam-Pat & Arz
[[durable_objects.bindings]]
name = "DARBAR_ROOM"
class_name = "DarbarRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DarbarRoomDO"]

# Secrets to set via `wrangler secret put`:
# - CLOUDFLARE_TURN_TOKEN_ID
# - CLOUDFLARE_API_TOKEN
# - FIREBASE_PROJECT_ID
# - LIVEKIT_API_KEY (optional, when switching VIDEO_PROVIDER = "livekit")
# - LIVEKIT_API_SECRET (optional, when switching VIDEO_PROVIDER = "livekit")
